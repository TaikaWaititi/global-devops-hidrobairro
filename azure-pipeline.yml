name: HidroBairro-CI-$(Date:yyyyMMdd).$(Rev:r)
trigger:
  batch: true
  branches:
    include:
      - main
pr: none

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    clean: true
  - task: JavaToolInstaller@0
    inputs:
      versionSpec: '21'
      jdkArchitectureOption: x64
      jdkSourceOption: PreInstalled
  - bash: |
      set -euo pipefail
      chmod +x mvnw
      mkdir -p test-results/h2
      status=0
      ./mvnw --batch-mode --no-transfer-progress clean verify || status=$?
      cp target/surefire-reports/TEST-*.xml test-results/h2/ 2>/dev/null || true
      exit "$status"
    displayName: Compilar e testar API e regras de alerta
  - bash: bash scripts/test-oracle-ci.sh
    displayName: Validar migracao e CRUD com Oracle real
    timeoutInMinutes: 15
  - task: PublishTestResults@2
    condition: always()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: 'test-results/**/TEST-*.xml'
      failTaskOnFailedTests: true
      failTaskOnMissingResultsFile: true
      testRunTitle: HidroBairro - API e Oracle
  - bash: |
      set -euo pipefail
      mkdir -p "$(Build.ArtifactStagingDirectory)/drop"
      cp target/gs-hidrobairro-0.0.1-SNAPSHOT.jar "$(Build.ArtifactStagingDirectory)/drop/app.jar"
      cd "$(Build.ArtifactStagingDirectory)/drop"
      sha256sum app.jar > app.jar.sha256
      printf '%s\n' "$BUILD_SOURCEVERSION" > commit.txt
    displayName: Preparar pacote versionado
  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)/drop'
      artifact: drop
      publishLocation: pipeline
