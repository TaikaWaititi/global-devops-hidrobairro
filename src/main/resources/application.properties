spring.application.name=gs-hidrobairro
springdoc.info.title=API HidroBairro Sul
springdoc.info.description=API para monitoramento de enchentes, alertas e orientação ao cidadão
springdoc.info.version=v1.0.0
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.try-it-out-enabled=true
spring.datasource.url=${ORACLE_URL}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.username=${ORACLE_USER}
spring.datasource.password=${ORACLE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
server.port=8080
logging.level.org.springdoc=INFO
logging.level.org.springframework.web=INFO
spring.jackson.default-property-inclusion=non_null
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
jwt.secret=${JWT_SECRET}
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=0
# Observabilidade
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=true
info.app.commit=${APP_VERSION:local}
spring.jpa.open-in-view=false
server.forward-headers-strategy=framework
